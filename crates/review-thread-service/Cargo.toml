flush = ["review-words-bus/flush"]

[dependencies]
agent-hooks = { path = "../agent-hooks" }
serde.workspace = true
vision-turns = { path = "../vision-turns" }
herdr-client = { path = "../herdr-client" }
review-words-bus = { path = "../review-words-bus" }
review-mcp = { path = "../review-mcp" }
review-store = { path = "../review-store" }
review-threads = { path = "../review-threads" }
review-types = { path = "../review-types" }
serde_json.workspace = true
thiserror.workspace = true
ui-events = { path = "../ui-events" }
uuid.workspace = true

[dev-dependencies]
hc-client = { path = "../hc-client" }
hc-test-support = { path = "../hc-test-support" }
herdr-bus.workspace = true
herdr-client = { path = "../herdr-client", features = ["memory"] }
review-source = { path = "../review-source" }
review-test-support = { path = "../review-test-support" }
review-words-bus = { path = "../review-words-bus", features = ["flush"] }
tempfile.workspace = true
test-case.workspace = true

