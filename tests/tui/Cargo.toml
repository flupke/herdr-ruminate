[package]
name = "reviewer-tui-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# A workspace of its own: herdr-common's test tooling comes by path from the checkout beside this
# one (herdr-common's ADR 0004), which a clone of this repository alone lacks, so it stays out of
# the workspace that builds and installs the reviewer.
[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
app-sandbox = { path = "../../../herdr-common/crates/app-sandbox" }
eyre = "0.6"
fake-agent = { path = "../../../herdr-common/crates/fake-agent" }
herdr-client = { path = "../../crates/herdr-client" }
notify = "8.2"
review-explore-page-settings = { path = "../../crates/review-explore-page-settings" }
review-repository = { path = "../../crates/review-repository" }
review-test-support = { path = "../../crates/review-test-support" }
rmcp = { version = "3.3", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reviewer-fake-agent = { path = "../../crates/reviewer-fake-agent" }
tempfile = "3.20"
tokio = { version = "1.52", features = ["macros", "rt", "signal"] }
vision-mcp = { path = "../../../herdr-common/crates/vision-mcp" }

# The workspace's crates take herdr-common's fake agent and frame signal from git, so that a clone
# of this repository alone builds them: here, where herdr-common is beside the checkout, they are
# the same crates as this workspace's, taken by path.
[patch."https://github.com/flupke/herdr-common"]
fake-agent = { path = "../../../herdr-common/crates/fake-agent" }
vision-signal = { path = "../../../herdr-common/crates/vision-signal" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
